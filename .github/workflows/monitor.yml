name: PARIVESH 2.0 Monitor V5

on:
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run V5
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python parivesh_monitor.py

      - name: Upload V5 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parivesh-v5-diagnostics
          path: data/parivesh_v5_diagnostics.json
          if-no-files-found: warn

      - name: Commit monitoring state
        if: always()
        run: |
          git config user.name "PARIVESH Monitor"
          git config user.email "parivesh-monitor@users.noreply.github.com"
          git add data/parivesh.db data/parivesh_v5_diagnostics.json
          git diff --cached --quiet || git commit -m "Update PARIVESH V5 state"
          git push
